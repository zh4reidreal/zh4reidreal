<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-label="Animated falling developer specialties">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="24%" stop-color="#FFFFFF" stop-opacity=".62"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="#67E8F9" flood-opacity=".52" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="190" rx="14" fill="url(#bg)"/>
  <path d="M26 20H974M26 170H974" stroke="#FFFFFF" stroke-opacity=".16"/>
  <text x="32" y="42" fill="#FFFFFF" fill-opacity=".62" font-family="monospace" font-size="11" letter-spacing="3">LIVE SKILL STREAM / ONLINE</text>
  <text x="854" y="42" fill="#FFFFFF" fill-opacity=".62" font-family="monospace" font-size="11">STATUS: 01</text>

  <g font-family="monospace" font-size="14" font-weight="700" fill="url(#textFade)" filter="url(#neon)">
    <g transform="translate(70,-104)">
      <text y="0">WEB</text><text y="24">DEVELOPER</text><text y="48">WEB</text><text y="72">DEVELOPER</text><text y="96">WEB</text><text y="120">DEVELOPER</text><text y="144">WEB</text><text y="168">DEVELOPER</text>
      <animateTransform attributeName="transform" type="translate" values="70,-104;70,182" dur="5.3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(223,-196)">
      <text y="0">DISCORD</text><text y="24">BOT</text><text y="48">DISCORD</text><text y="72">BOT</text><text y="96">DISCORD</text><text y="120">BOT</text><text y="144">DISCORD</text><text y="168">BOT</text><text y="192">DISCORD</text><text y="216">BOT</text>
      <animateTransform attributeName="transform" type="translate" values="223,-196;223,182" dur="6.5s" begin="-1.9s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(405,-88)">
      <text y="0">WEB</text><text y="24">SECURITY</text><text y="48">WEB</text><text y="72">SECURITY</text><text y="96">WEB</text><text y="120">SECURITY</text><text y="144">WEB</text><text y="168">SECURITY</text>
      <animateTransform attributeName="transform" type="translate" values="405,-88;405,182" dur="4.9s" begin="-3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(575,-212)">
      <text y="0">WEB</text><text y="24">DESIGN</text><text y="48">WEB</text><text y="72">DESIGN</text><text y="96">WEB</text><text y="120">DESIGN</text><text y="144">WEB</text><text y="168">DESIGN</text><text y="192">WEB</text><text y="216">DESIGN</text>
      <animateTransform attributeName="transform" type="translate" values="575,-212;575,182" dur="6.9s" begin="-4.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(752,-137)">
      <text y="0">DISCORD</text><text y="24">AUTOMATION</text><text y="48">DISCORD</text><text y="72">AUTOMATION</text><text y="96">DISCORD</text><text y="120">AUTOMATION</text><text y="144">DISCORD</text><text y="168">AUTOMATION</text><text y="192">DISCORD</text>
      <animateTransform attributeName="transform" type="translate" values="752,-137;752,182" dur="5.7s" begin="-2.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
