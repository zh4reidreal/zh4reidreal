<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-label="Animated falling code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08080B"/>
      <stop offset="50%" stop-color="#11101A"/>
      <stop offset="100%" stop-color="#08080B"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C4B5FD" stop-opacity=".9"/>
      <stop offset="70%" stop-color="#67E8F9" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="190" rx="14" fill="url(#bg)"/>
  <path d="M26 20H974M26 170H974" stroke="#67E8F9" stroke-opacity=".18"/>
  <text x="32" y="42" fill="#C4B5FD" fill-opacity=".72" font-family="monospace" font-size="11" letter-spacing="3">LIVE TERMINAL / STREAM ACTIVE</text>
  <text x="832" y="42" fill="#67E8F9" fill-opacity=".72" font-family="monospace" font-size="11">01 01 01</text>

  <g font-family="monospace" font-size="16" font-weight="700" fill="url(#fade)" filter="url(#glow)">
    <g transform="translate(92,-110)">
      <text y="0">const</text><text y="24">code</text><text y="48">=</text><text y="72">&lt;/&gt;</text><text y="96">101</text><text y="120">{ }</text><text y="144">run()</text><text y="168">/ /</text><text y="192">010</text><text y="216">dev</text>
      <animateTransform attributeName="transform" type="translate" values="92,-110;92,180" dur="5.1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(205,-185)">
      <text y="0">if()</text><text y="24">true</text><text y="48">npm</text><text y="72">::</text><text y="96">ship</text><text y="120">001</text><text y="144">web</text><text y="168">api</text><text y="192">[ ]</text><text y="216">bot</text>
      <animateTransform attributeName="transform" type="translate" values="205,-185;205,180" dur="6.4s" begin="-2.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(328,-85)">
      <text y="0">&lt;div&gt;</text><text y="24">css</text><text y="48">git</text><text y="72">++</text><text y="96">node</text><text y="120">010</text><text y="144">flow</text><text y="168">end</text>
      <animateTransform attributeName="transform" type="translate" values="328,-85;328,180" dur="4.7s" begin="-1.1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(480,-220)">
      <text y="0">fetch</text><text y="24">json</text><text y="48">{ }</text><text y="72">bot</text><text y="96">001</text><text y="120">auth</text><text y="144">dev</text><text y="168">&amp;&amp;</text><text y="192">live</text><text y="216">run</text>
      <animateTransform attributeName="transform" type="translate" values="480,-220;480,180" dur="6.8s" begin="-4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(635,-135)">
      <text y="0">type</text><text y="24">safe</text><text y="48">/ /</text><text y="72">web</text><text y="96">0x01</text><text y="120">scan</text><text y="144">code</text><text y="168">sys</text><text y="192">end</text>
      <animateTransform attributeName="transform" type="translate" values="635,-135;635,180" dur="5.5s" begin="-3.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(790,-200)">
      <text y="0">async</text><text y="24">await</text><text y="48">010</text><text y="72">bot</text><text y="96">&lt;/&gt;</text><text y="120">push</text><text y="144">main</text><text y="168">//</text><text y="192">ok</text><text y="216">done</text>
      <animateTransform attributeName="transform" type="translate" values="790,-200;790,180" dur="6.1s" begin="-1.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(910,-100)">
      <text y="0">0xFF</text><text y="24">web</text><text y="48">++</text><text y="72">dev</text><text y="96">[x]</text><text y="120">bot</text><text y="144">run</text><text y="168">010</text>
      <animateTransform attributeName="transform" type="translate" values="910,-100;910,180" dur="4.9s" begin="-2.9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
